name: CI Build

on:
  push:
    branches: [ main, debug ]
  pull_request:
    branches: [ main, debug ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
    - name: Configure
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cd build && cmake --build . --parallel $(nproc)
    - name: Verify
      run: ls -la bin/

  build-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: vcpkg install sqlite3:x64-windows
    - name: Configure
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows
    - name: Build
      run: cd build && cmake --build . --config Release --parallel
    - name: Verify
      run: dir bin\Release\