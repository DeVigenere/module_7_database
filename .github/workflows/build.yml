name: CI Build

on:
  push:
    branches: [ main, debug ]
  pull_request:
    branches: [ main, debug ]

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install system tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl zip unzip tar build-essential
    - name: Configure
      run: |
        mkdir -p build
        cd build
        cmake ..
    - name: Build
      run: cd build && cmake --build . --parallel $(nproc)
    - name: Verify
      run: ls -la bin/

  build-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: |
        mkdir build
        cd build
        cmake ..
    - name: Build
      run: cd build && cmake --build . --config Release
    - name: Verify
      run: dir bin\Release\